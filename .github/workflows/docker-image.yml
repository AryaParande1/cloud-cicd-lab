name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build ./cloud-cicd-lab --file ./cloud-cicd-lab/Dockerfile --tag my-image-name:$(date +%s)
